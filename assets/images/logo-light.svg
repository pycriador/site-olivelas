<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5AD7D" />
      <stop offset="50%" stop-color="#B79C6B" />
      <stop offset="100%" stop-color="#A48754" />
    </linearGradient>
  </defs>
  <!-- Flame Icon -->
  <g transform="translate(250, 140) scale(1.4)">
    <!-- Outer flame contour -->
    <path d="M 0,-65 C 18,-35 32,-15 32,15 C 32,38 18,52 0,52 C -18,52 -32,38 -32,15 C -32,-12 -20,-38 0,-65 Z" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Inner wick curve -->
    <path d="M -2,42 C 14,35 16,10 6,-8 C 1,-17 -2,-26 -2,-35" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- OLIVELAS text in Playfair Display serif -->
  <text x="250" y="325" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="600" fill="#1B1B1B" text-anchor="middle" letter-spacing="4">OLIVELAS</text>
  
  <!-- VELA AROMÁTICA text in Montserrat -->
  <text x="250" y="365" font-family="'Montserrat', sans-serif" font-size="14.5" font-weight="500" fill="#555555" text-anchor="middle" letter-spacing="7">VELA AROMÁTICA</text>
</svg>